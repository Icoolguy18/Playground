<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="playground.css">
    <title>Model Playground</title>
</head>
<body>
<div class="playground-backdrop"></div>
<div class="playground-container">
    <header class="header-bar">
        <div class="brand-section">
            <!-- Toggle Layer Palette Button -->
            <button id="btnTogglePalette" class="tool-btn" title="Toggle Layer Palette">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
            </button>

            <div class="brand-logo" title="Model Playground">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <span class="brand-title">Model Playground</span>
        </div>

        <!-- Center Controls / Model Identifier -->
        <div class="model-controls">
            <input type="text" id="modelNameInput" class="model-name-input" value="customModel" title="Model Name">
            <select id="frameworkSelector" class="dropdown-select" title="Target Framework & Version">
                <option value="pytorch_2">PyTorch 2.x (nn.Module)</option>
                <option value="keras_3">Keras 3 / TensorFlow (Functional)</option>
                <option value="onnx">ONNX Graph Spec</option>
            </select>
            <!-- Dynamic Model Layer Counter -->
            <span class="brand-badge" id="modelLayerCount">0 Layers</span>
        </div>

        <div class="header-actions">
            <button id="btnToggleCode" class="btn-moon btn-moon-primary">View Code</button>
            <button id="btnClear" class="btn-moon" title="Reset workspace">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Clear
            </button>
        </div>
    </header>

    <!-- MAIN BODY WORKSPACE -->
    <main class="workspace-grid">

        <!-- COMPONENT A: LAYER SELECTION PALETTE -->
        <aside class="panel-sidebar" id="layerPalette">
            <div class="panel-header">
                <span class="panel-title">Layer Palette</span>
            </div>

            <div class="search-box">
                <input type="text" id="layerSearch" class="search-input" placeholder="Search layers..." autocomplete="off">
            </div>

            <div class="palette-scroll" id="paletteList">
                <!-- 1. Input & Reshaping -->
                <div class="category-group">
                    <div class="category-title">Input & Reshaping</div>
                    <div class="layer-card" draggable="true" data-type="Input">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-input">IN</span>
                            <span class="layer-name">Input Tensor</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                    <div class="layer-card" draggable="true" data-type="Flatten">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-linear">FL</span>
                            <span class="layer-name">Flatten</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                </div>

                <!-- 2. Convolutional -->
                <div class="category-group">
                    <div class="category-title">Convolutional</div>
                    <div class="layer-card" draggable="true" data-type="Conv2d">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-conv">C2</span>
                            <span class="layer-name">Conv2d</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                    <div class="layer-card" draggable="true" data-type="MaxPool2d">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-conv">MP</span>
                            <span class="layer-name">MaxPool2d</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                </div>

                <!-- 3. Linear & Normalization -->
                <div class="category-group">
                    <div class="category-title">Linear & Normalization</div>
                    <div class="layer-card" draggable="true" data-type="Linear">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-linear">FC</span>
                            <span class="layer-name">Linear (Dense)</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                    <div class="layer-card" draggable="true" data-type="Dropout">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-linear">DO</span>
                            <span class="layer-name">Dropout</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                    <div class="layer-card" draggable="true" data-type="BatchNorm2d">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-norm">BN</span>
                            <span class="layer-name">BatchNorm2d</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                </div>

                <!-- 4. Activations -->
                <div class="category-group">
                    <div class="category-title">Activations</div>
                    <div class="layer-card" draggable="true" data-type="ReLU">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-activation">RL</span>
                            <span class="layer-name">ReLU</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                    <div class="layer-card" draggable="true" data-type="Softmax">
                        <div class="layer-info">
                            <span class="layer-icon-badge badge-activation">SM</span>
                            <span class="layer-name">Softmax</span>
                        </div>
                        <span class="drag-handle">⠿</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- COMPONENT B: DISPLAY & CONNECTIONS CANVAS -->
        <section class="canvas-container" id="canvasContainer">
            <div class="canvas-toolbar">
                <button class="tool-btn" id="btnZoomIn" title="Zoom In">+</button>
                <button class="tool-btn" id="btnZoomOut" title="Zoom Out">−</button>
                <button class="tool-btn" id="btnResetView" title="Reset View">⊙</button>
                <span style="width: 1px; height: 16px; background: var(--border-moon-medium); margin: 0 4px;"></span>
                <button class="tool-btn" id="btnAutoLayout" title="Auto Align">⌥</button>
            </div>

            <svg class="connections-layer" id="svgConnectionsLayer"></svg>
            <div class="graph-viewport" id="graphViewport"></div>
        </section>
    </main>

    <!-- CODE DRAWER -->
    <aside id="codeDrawer" class="code-drawer hidden">
        <div class="code-drawer-header">
            <div class="code-drawer-title">
                <span>Model Code</span>
                <span class="brand-badge" id="codeFormatBadge">{PyTorch 2.x}</span>
            </div>
            <div class="drawer-actions">
                <button id="btnCopyCode" class="btn-moon btn-sm" title="Copy Code">Copy</button>
                <button id="btnExport" class="btn-moon btn-sm" title="Export .py">Export</button>
                <button id="btnCloseDrawer" class="tool-btn" title="Close Drawer">✕</button>
            </div>
        </div>
        <pre class="code-editor-area" id="codeOutput"><code># Generated code will appear here</code></pre>
    </aside>
</div>

<!-- Main Entry Point Script (using ES Modules) -->
<script type="module" src="main.js"></script>
</body>
</html>
